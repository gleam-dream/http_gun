name = "http_gun"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
licences = ["Apache-2.0"]
description = "Owned HTTP byte streams, bounded collection and explicit cassettes on Gun."
internal_modules = ["http_gun/internal", "http_gun/internal/*"]

[dependencies]
sinal = { path = "../sinal" }
gleam_stdlib = ">= 0.71.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
file_streams = ">= 1.7.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
# Exact pins: src/http_gun_ffi.erl classifies Gun/Cowlib error terms whose
# shapes Gun documents only as any() ({stream_error, _, _},
# {connection_error, limit_reached, _}, closing, ...), and the submission
# evidence rules rest on reviewed Gun 2.6.0 request internals. The H2 test
# server drives Cowlib's undocumented cow_http2/cow_hpack modules. Re-review
# both before changing either version.
gun = "== 2.6.0"
cowlib = "== 2.20.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
