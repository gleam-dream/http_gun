name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [default, otp28, otp27]
        dependencies: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix flake check
      - run: nix run .#design-gate-check -- docs/design .
      - run: nix develop ".#${{ matrix.runtime }}" --command sh dev/gate full
        env:
          HTTP_GUN_DEPENDENCIES: ${{ matrix.dependencies }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: http-gun-${{ matrix.runtime }}-${{ matrix.dependencies }}-${{ github.run_attempt }}
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 14
  ci:
    name: CI
    if: always()
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every mandatory result
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: test "$GATE_RESULT" = success
