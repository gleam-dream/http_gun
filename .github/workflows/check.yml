name: Local contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [default, otp28, otp27]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix develop "path:.#${{ matrix.runtime }}" --command sh dev/gate full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-${{ matrix.runtime }}
          path: build/evidence
