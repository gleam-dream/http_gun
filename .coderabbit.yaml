# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Review policy for http_gun, derived by the coderabbit-config skill.
# Each instruction names the skill it comes from; `policy` is the review policy
# of coderabbit-config itself, and `repository` marks a rule beyond the catalog.
#
# Catalogs read:
#   practice catalog (not public)  879841a61c3f83cd809edca9229c4a6bb7f909f8
#   gleam-agent-tools  6a9ea2f647e787a32d3c7fa88d9c58c5b81ae9d7
#
# Governing skills: coderabbit-config (policy), gleam, gleam-lib, gleam-ffi,
# http-gun, gleam-otp, sinal, testing, python, design, tracker, gate, git.
#
# Governing dependency versions: http_gun 0.2.0 (this package, gleam.toml).
# The http-gun skill's install line names 0.1.0; every rule taken from it was
# checked against the 0.2.0 public API, which still has each function cited.
# Locked in manifest.toml: gun 2.6.0, cowlib 2.21.0, gleam_otp 1.3.0,
# gleam_erlang 1.3.0, sinal 0.1.0, telemetry 1.4.2, gleam_http 4.4.0,
# gleam_json 3.1.0, file_streams 1.7.0, simplifile 2.7.0, gleam_stdlib 1.0.5,
# gleeunit 1.11.0.
language: en-US
tone_instructions: >-
  Literal and concise. Report only defects you can evidence from the diff, its
  callers, the design, or a cited rule. One finding per cause. An empty review
  is valid.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    Lead with the problem the change solves, then the response in one short
    paragraph, then the public API or cassette-schema effect, if any. Do not
    narrate the diff file by file.
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: true
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main

  # Rendered, locked and retained-evidence output, and throwaway TLS test
  # certificates and keys (not secrets).
  path_filters:
    - "!flake.lock"
    - "!docs/design/design-layer.pdf"
    - "!docs/evidence/**"
    - "!test/fixtures/*.{crt,key}"

  path_instructions:
    - path: "{src,dev,examples}/**"
      instructions: |
        Review policy (policy).
        - Design first. docs/COVERAGE.md maps each part to its owning section
          of docs/design/design.typ and to docs/adr. Flag code that
          contradicts that section's interface, invariants or side effects,
          and a change to designed behavior with no change to its design. A
          fix that restores designed behavior needs none. When code and
          design disagree, the design changes first.
        - Core abstractions. Flag a second representation of a concept the
          design names (Client view, Origin, Exchange, Stream lease, Body
          capability, Submission evidence, Destination policy, Origin lane,
          Cancellation token, Batch, Script, Cassette, Recording session,
          Playback session, Redaction), a name that differs from
          docs/design/CONTEXT.typ, and a public module that reaches into
          `http_gun/internal` past the interface that owns it.
        - Lean. Flag code no test, caller or unit needs: an unset option, an
          unvaried parameter, a wrapper that adds no rule, an unreachable
          branch. Say what to delete.
        - Migration, never a legacy path. Flag a compatibility shim, a
          fallback to an old format, a dual read or write, a deprecated alias,
          and a flag that keeps old behavior; a cassette reader accepts only
          the schema versions the design lists (ADR-0019). A change that
          breaks the public API or the cassette schema ships as a breaking
          release, decided explicitly, with a migration note; an addition
          that keeps every existing caller compiling and behaving needs none.
        - Composable. In a public module, flag hidden call ordering, global
          state, a mandatory framework where functions compose, a concept the
          common caller must learn and does not need, and a module with two
          responsibilities.
        - Test first. Flag a behavior change with no test that exercises it,
          and a test bound to internals.
        - Typed before foreign. Flag Erlang where Gleam does the job, an
          unchecked cast, an untyped value that reaches domain logic
          undecoded, and a crash on a routine failure.
        - Silence. Report nothing that `nix fmt`, the compiler with warnings
          as errors, the tests or dev/gate decide, and no layout or naming
          preference without a written rule.

    - path: "{src,test,dev,examples}/**/*.gleam"
      instructions: |
        Gleam (gleam).
        - Flag a module function, private included, without annotated
          arguments and return type, and an imported function or constant used
          unqualified.
        - Flag a name against the conventions: `Json` not `JSON`,
          conversions named `x_to_y` or `to_y` inside module `x`, `try_` only
          for an error-propagating counterpart.
        - Flag `Option` carrying a failure, and a change that merges omitted,
          explicit false, empty and failed where they mean different things.
        - Flag an error a caller must parse as a string to choose recovery.
        - Flag independent optional fields or booleans standing for exclusive
          states; they are variants.
        - Flag a predicate check followed by `let assert` on the same shape,
          and a catch-all branch that silently accepts a new variant of a
          failure kind, evidence or body state.
        - Flag `panic` or `let assert` handling a routine network, file or
          decode failure in `src/`.
        - Flag a refactor that changes observable errors, ordering or effects.
        - Flag a compatibility branch with no comment saying why it exists.
        - Flag `src/` importing a `test/` or `dev/` module or `gleeunit`.
        - Flag a new process, module or generic machinery added only for
          organization, and a local type replacing a compatible ecosystem type.

    - path: "src/**/*.gleam"
      instructions: |
        Published library surface (gleam-lib). Exported constructors, fields,
        variants, module paths and behavior of `http_gun` and `http_gun/*`
        outside `http_gun/internal` are the compatibility surface;
        `internal_modules` in gleam.toml marks instability, not access
        control.
        - Flag a removed or changed export, variant, field or behavior in a
          public module that the pull request does not call breaking; the
          published release is the baseline and a breaking change needs an
          explicit release decision (AGENTS.md).
        - Flag a public signature that exposes an implementation-state type
          parameter.
        - Flag an argument that does not affect behavior, a setter per field
          where a record update works, and two public paths for one common
          task.
        - Flag configuration validated after the pool or a connection is
          allocated, and an allocation limit enforced after allocation.
        - Flag a builder or extension protocol with no distinct use case.
        - Flag a deliberate crash on a failure the caller could act on; return
          a structured error instead.
        - Flag the library taking over policy that belongs to the
          application: status interpretation, payload decoding, retries and
          backoff, redirects, decompression (AGENTS.md).

    - path: "{src,test,examples}/**/*.{gleam,erl}"
      instructions: |
        Foreign boundaries (gleam-ffi; AGENTS.md "Constraints"). Apply to
        `*.erl` files and to a Gleam module that declares `@external`.
        - Flag Erlang beyond Gun bindings and message conversion, missing
          filesystem or runtime operations, and exception-safe scope cleanup;
          pool admission, body ownership, batching, matching, codecs and
          recording coordination stay in Gleam, with no Erlang pool,
          body-owner or cassette-session server.
        - Flag validation, branching or state transitions in Erlang.
        - Flag an external that declares a native value to be a checked domain
          value, `Dynamic` or a type variable that accepts every handle, and a
          generic return that hides an unchecked cast.
        - Flag Erlang that builds a Gleam `Result` or variant with a shape the
          compiler does not generate for it.
        - Flag an expected Gun or Cowlib failure not mapped to the declared
          failure value, and code that assumes Gleam catches an Erlang
          exception.
        - Flag a new reliance on an undocumented Gun or Cowlib term, or a
          widened gun/cowlib range in gleam.toml, without the design's native
          assumption inventory changing with it (ADR-0007).
        - Flag a patched dependency or a hand-written wire parser.
        - Flag a foreign function with no remaining caller.

    - path: "src/**/*.gleam"
      instructions: |
        HTTP Gun contracts (http-gun; checked against 0.2.0).
        - Flag an automatic retry, redirect, decompression or generic SSE
          parsing added to the client.
        - Flag a failure that loses its submission evidence, reports
          `NotSent` where the request may have reached the network, or drops
          `error.status` and `error.headers` after a body-collection failure.
        - Flag `error.is_retryable` deciding without the caller's
          `idempotent` argument, and a timeout or cancellation reported as
          proof that the server did nothing.
        - Flag a destination view that can widen its client's authority,
          loopback reached without `destination.allow_loopback`, a bypass of
          destination policy on connection replacement, and `SNI=disable`
          for an IP literal (AGENTS.md).
        - Flag a body readable from a process other than the one that opened
          it, a copy that creates an independent cursor, and `with_response`
          that does not close the body on callback return or exception.
        - Flag `body.next_within` that reports `None` as end of stream.
        - Flag a collection limit that returns truncated bytes without
          setting `truncated`.
        - Flag `batch` results that do not keep input order, and concurrency
          not bounded by the caller's setting.
        - Flag recording redaction changeable after startup, a recording
          whose publication result is not returned to the caller, and
          default redaction documented as removing every secret.

    - path: "{examples,dev}/**/*.gleam"
      instructions: |
        HTTP Gun consumers (http-gun; checked against 0.2.0). Apply to a
        module that imports `http_gun`.
        - Flag a response body decoded before `buffered.response.status` is
          inspected; an `Ok` transport result can hold a 404 or 503.
        - Flag a truncated collection decoded as a complete document without
          checking `buffered.truncated`.
        - Flag a shared client started by a short-lived request process; use
          `http_gun.supervised` and `http_gun.named`, and stop supervised
          clients through their parent.
        - Flag a body from `open` not closed on every path, including after
          EOF or failed collection, and a worker reading a body its parent
          opened.
        - Flag a retry that does not use `error.is_retryable` with the
          request's actual idempotency, and backoff or attempt limits left
          out where the module retries.
        - Flag a local service or test reached without
          `destination.allow_loopback` set explicitly.
        - Flag recording without provider headers, query tokens or body
          rewriting added to the redaction, and a recording finished without
          handling its result.

    - path: "{src,dev,examples}/**/*.gleam"
      instructions: |
        Processes (gleam-otp; rules for gleam_otp 1.3.0, gleam_erlang 1.3.0).
        Apply to a module that imports `gleam/otp` or `gleam/erlang/process`.
        - Flag `process.call` whose timeout or callee exit is handled as a
          returned error or as proof the request had no effect, and a call
          timeout that triggers an unconditional retry of a request.
        - Flag network or file work inside the pool or lifecycle process that
          must stay responsive to admission, cancellation or shutdown.
        - Flag a subject received from outside its owning process.
        - Flag admitted requests, open bodies or waiting messages with no
          bound.
        - Flag a process name or atom created from request input; allocate a
          bounded set at startup.
        - Flag a supervisor strategy that does not match the children's
          dependency, and a dependant that keeps an unusable handle after a
          restart.
        - Flag a spawn closure, message or start argument that captures more
          than the call needs (ADR-0003, minimal process captures).
        - Flag an actor introduced only to organize functions.

    - path: "{src,test,examples}/**/*.gleam"
      instructions: |
        Telemetry (sinal; rules for sinal 0.1.0, telemetry 1.4.2). Apply to a
        module that imports `sinal`.
        - Flag an event name, field key or route prefix built from request
          input; put request ids and other unbounded values in metadata
          values.
        - Flag a custom getter or encoder that can fail or raise in the
          emitting process.
        - Flag an enum field codec whose list misses a constructor.
        - Flag a handler that does I/O on a request path, and an attachment a
          test does not detach.
        - Flag delivery attached by the library instead of left to the
          application (ADR-0006), and telemetry used to decide whether a
          request reached the server.

    - path: "{test,examples/async/test}/**"
      instructions: |
        Tests (testing).
        - Flag a test that confirms success through internals, private state
          or a side channel where the public API can show it.
        - Flag a mock of an internal collaborator, and an assertion on call
          counts or call order.
        - Flag a scenario outcome that no design rule states.
        - Flag tests left in place for an interface the diff replaced.
        - Flag a refusal or illegal input the change introduces with no test
          through the public boundary.
        - Flag a network test that mocks Gun where a local server fixture can
          serve, and a new transport path with no test of timeout,
          cancellation, disconnect or partial body where the design states
          its outcome.
        - Flag a cassette fixture written in a schema version the design does
          not list (AGENTS.md).

    - path: "dev/**/*.py"
      instructions: |
        Python gate and comparison scripts (python).
        - Flag `Any`, and an external value (file, JSON, process output) used
          without parsing.
        - Flag an abstract base class hierarchy; use `Protocol`.
        - Flag mutable dataclasses inside the program, and exclusive states as
          flags instead of tagged frozen dataclasses matched with
          `assert_never`.
        - Flag a parser model passed past the boundary.

    - path: "docs/{design,adr}/**"
      instructions: |
        Design layer (design; policy).
        - Fresh reader. The reviewer never saw the change being made. Flag a
          changed unit that does not tell a reader with no memory what the
          code does not say, and a unit that copies the code.
        - Flag content the code states: payloads, fields, limits, timeouts,
          function or file lists, queries. Name the rule it serves instead; a
          file or symbol is allowed only where a reader needs it to find where
          a rule is enforced.
        - Flag session narration, progress notes, status or delivery history.
        - Flag a unit missing one of overview, interface, invariants, side
          effects and verification; an empty part says "none".
        - Flag a concept defined in a second home, a glossary term with two
          meanings, and a retired term reused.
        - Flag an edit to an accepted ADR's text instead of a superseding ADR,
          and a changed date on a pending entry.

    # AGENTS.md names the local tracker; no issue file exists yet.
    - path: "issues/**/*.md"
      instructions: |
        Local tracker (tracker; AGENTS.md).
        - Each issue file carries one `Status:` and one `Category:` header
          with a value AGENTS.md lists.
        - Flag an issue titled with a solution instead of the observable
          problem, line numbers or solution code in an issue, and a horizontal
          task such as "build the data layer".
        - Flag an AI-written comment that does not start with
          `AI-assisted contribution.`

    - path: "{dev/**,flake.nix,lefthook.yml,.github/**}"
      instructions: |
        Gate (gate). Apply to the gate scripts under dev/ (`gate`, `env`,
        `matrix`, the consumer runners, the comparison runner and the Python
        checks), the flake, the hooks and CI.
        - Flag a check that passes or skips when its tool is missing; it
          fails or reports unmeasured.
        - Flag a tool not supplied through the Nix flake, and a command that
          differs between local runs and CI.
        - Flag a new check that encodes a layout, naming or README
          convention, and a check that scripts what a tool already performs.
        - Flag a replaced check that drops security or data-integrity
          coverage, such as TLS trust, destination policy or cassette
          redaction tests.
        - Flag a gate that keeps a formatting check but loses compile,
          native compilation or behavior tests, or the matrix run on the
          minimum and newest gun and cowlib patches.

    - path: ".github/workflows/pr-title.yml"
      instructions: |
        Pull request title check (gate).
        - This file mirrors the shared title workflow. Flag a change that
          makes it differ from the shared copy: types, patterns, action pin,
          triggers or permissions.
        - It is the one convention CI checks, so do not flag it as a
          convention turned into a check.
        - Its tool is the pinned action in place of a flake tool, because the
          title exists on the pull request and never in a checkout.

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: warning
    issue_assessment:
      mode: "off"
    docstrings:
      mode: "off"
    custom_checks:
      - name: No weakened test or gate
        mode: error
        instructions: |
          Source: policy, gate. Fail if the diff skips, deletes, disables or
          loosens a test, a consumer run or a step of dev/gate, dev/matrix or
          CI (including removing a runtime or dependency row from the CI
          matrix, a consumer from dev/consumers, or adding
          `continue-on-error`), and the pull request description does not name
          the behavior that no longer exists or the stronger check that
          replaces it. Pass otherwise.
      - name: Behavior change carries its design
        mode: warning
        instructions: |
          Source: policy, design. Warn if the diff changes public behavior, an
          invariant, the cassette schema or a native assumption in src/ or
          gleam.toml, unless either holds: the diff changes the design
          section or ADR that owns that part (docs/COVERAGE.md names the
          owner), or the pull request description names the owning design
          section whose behavior the change restores or preserves and the
          diff does what that section states. An edit to an unrelated design
          section or ADR, or a bare claim that behavior is preserved, does
          not pass. Pass for tests, tooling and documentation-only changes.
      - name: Breaking change is declared
        mode: warning
        instructions: |
          Source: policy, gleam-lib. Warn if the diff removes or changes an
          exported function, type, constructor, field or module path in
          `http_gun` or an `http_gun/*` module outside `http_gun/internal`,
          or changes the cassette schema, and the pull request description
          does not call the change breaking and give its migration. Pass
          otherwise.
      - name: Problem-first description
        mode: warning
        instructions: |
          Source: git. Warn unless the pull request description gives the
          problem, why it matters, one concrete example, the solution in one
          paragraph, its trade-offs, and what was verified, with no file
          tour, and its claims match the diff.
      - name: No attribution text
        mode: warning
        instructions: |
          Source: git. Warn if the pull request title or description contains
          a co-author credit, `Co-Authored-By`, a "Generated with" or
          "Generated by" line, or a line starting with the robot emoji.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

  tools:
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    # The repository does not run actionlint.
    actionlint:
      enabled: false
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    # The repository runs no prose or YAML linter and no second Python
    # linter; their findings would be preferences without a written rule
    # (policy, Silence).
    pylint:
      enabled: false
    flake8:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: false
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    # AGENTS.md and CLAUDE.md are read by default.
    filePatterns:
      - files: "docs/COVERAGE.md,docs/design/*.typ,docs/adr/*.md"
        applyTo: "src/**,test/**,dev/**,examples/**"
      - files: "docs/ORACLE.md,docs/BENCHMARKS.md"
        applyTo: "dev/**,examples/comparison/**"
  learnings:
    scope: local
  pull_requests:
    scope: local
